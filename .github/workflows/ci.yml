name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          # [google] extra：test_google_api_key.py 需要 langchain-google-genai。
# 当年把它挪进可选组是为了绕开 mootdx 的 httpx<0.24 冲突，mootdx 已移除，不再冲突。
pip install -e ".[google]" pytest
      - name: Run tests
        run: pytest -q
